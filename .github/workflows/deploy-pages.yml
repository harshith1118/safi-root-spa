name: Deploy Root SPA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages using an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Keep production deployments serialized without cancelling an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Root/package-lock.json

      - name: Install dependencies
        working-directory: Root
        run: npm ci

      - name: Lint
        working-directory: Root
        run: npm run lint

      - name: Build
        working-directory: Root
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Root/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
